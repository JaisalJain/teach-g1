# Single source of truth for object geometry. Perception and sim both read this file.
# source: label = printed on the mug's base label (manufacturer spec, ~±2 mm);
#         derived = computed from label values;
#         estimated = eyeballed or guessed, never use as validation ground truth.
mug:
  body_outer_diameter_m: {value: 0.099, source: label}   # label "L 9.90 cm"
  height_m:              {value: 0.091, source: label}   # label "H 9.10 cm"
  overall_width_with_handle_m: {value: 0.143, source: label}  # label "W 14.30 cm"
  handle_protrusion_m:   {value: 0.044, source: derived}  # 0.143 - 0.099
  handle_height_m:       {value: 0.06, source: measured}
  handle_thickness_m:    {value: 0.010, source: measured}
  mass_kg:               {value: 0.40, source: estimated} # owner's estimate, no scale
  capacity_ml: 414
  ruler_check: {diameter_m: 0.10, height_m: "0.09-0.10", note: "ruler agrees with label within ruler resolution; label values stay authoritative"}
coaster:
  diameter_m:  {value: 0.104, source: estimated}  # "about 0.5 cm bigger than the mug"
  thickness_m: {value: 0.005, source: estimated}
desk:
  length_m: {value: 0.60, source: measured}    # long edges; I sit at the near long edge
  width_m:  {value: 0.385, source: measured}   # ±0.5 cm; the near long edge has a shallow curve
